faq:
  - q: "Why didn't you cut the main bottle to make it shorter?"
    a: "Cutting the main 2.25 L PET bottle destroys its structural integrity and pressure rating. Instead, we kept the 36 cm pressure vessel completely intact and slid an ~18 cm donor PET bottle top over the dome like a sleeve, keeping our total length at 47-48 cm (strictly under the 50 cm limit) without compromising burst strength."
  - q: "Why did you use 750 mL of water instead of filling it halfway?"
    a: "750 mL is ~33% of our 2.25 L bottle, leaving 1.50 L for compressed air. Too little water exhausts thrust too quickly, while too much water adds heavy dead mass and leaves too little compressed air volume to expel the water efficiently."
  - q: "How did you prevent the cardboard fins from tearing or bending during launch?"
    a: "We tack-aligned the four 9 cm * 5 cm triangular fins at 90 degrees intervals, then reinforced both sides of every fin with waterproof plastic packaging tape 'L-bracket' fillets, wrapped leading-edge tape caps to cut drag and moisture, and secured the roots with a circumferential base locking band."
  - q: "Why did you put clay inside the nose cone?"
    a: "Packing ~40 g of JOVI air-dry clay tightly into the nose tip shifts the Center of Gravity (CG) forward while our four tail fins pull the Center of Pressure (CP) rearward. Keeping CG ahead of CP ensures aerodynamic stability and prevents mid-air tumbling."
  - q: "Can the rocket burst under pressure?"
    a: "A damaged or fatigued PET bottle can rupture if over-pressurized. We mitigate this by never cutting the pressure vessel, inspecting for stress whitening or dents before every launch, retiring bottles after 10-15 launches, wearing goggles, and keeping everyone at least 15 ft (4.6 m) behind the safety barrier."
