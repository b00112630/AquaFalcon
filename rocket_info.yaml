  launcher: "Official NGN 110 angled base launcher with an electric air pump."
  why_this_design: "We left the main 2.25 L bottle uncut to preserve pressure integrity, slid an ~18 cm PET sleeve over the dome to stay within the 47-48 cm total length limit (under 50 cm), packed ~40 g of clay into the nose tip to shift CG forward, and reinforced 4 corrugated cardboard fins with waterproof tape 'L-bracket' fillets, leading-edge caps, and a circumferential locking band to eliminate drag and prevent fin shear on launch."

